# Netlify Configuration for Averish Shipping AI / DocuMatch

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Presentation Deck Routes
[[redirects]]
  from = "/presentation"
  to = "/presentation.html"
  status = 200

[[redirects]]
  from = "/slides"
  to = "/presentation.html"
  status = 200

# Live Persistent FastAPI Backend Proxy:
# Points API queries directly to persistent host.
# In production, set BACKEND_URL in Netlify environment variables or point directly via VITE_API_URL in frontend.
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-documatch-backend.up.railway.app/api/:splat"
#   status = 200

# Single Page Application (SPA) fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
