version: '3.8'

services:
  documatch-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: documatch-hackathon-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
